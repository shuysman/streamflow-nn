experiment_name: scratch_3var_combined
device: cuda:0

# Paths (relative to transfer_learning/)
data_dir: data/neuralhydrology
train_basin_file: data/basin_lists/all_basins.txt
validation_basin_file: data/basin_lists/all_basins.txt
test_basin_file: data/basin_lists/all_basins.txt

# Model Architecture (matching fine-tuned model for fair comparison)
model: cudalstm
head: regression
output_activation: linear
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.4

# Training Settings
optimizer: Adam
loss: NSE
learning_rate: 1.0e-3
batch_size: 256
epochs: 30

metrics:
  - NSE
  - KGE
  - RMSE
  - Pearson-r

# Data Configuration
dataset: generic
predict_last_n: 1
seq_length: 365  # From Kratzert et al. 2021

# Date Ranges (1 year spinup needed for seq_length=365)
train_start_date: '01/10/1991'
train_end_date: '30/09/2015'
validation_start_date: '01/10/2015'
validation_end_date: '30/09/2020'
test_start_date: '01/10/2020'
test_end_date: '31/12/2024'

target_variables:
  - QObs_mm_d

dynamic_inputs:
  - prcp_mm_day
  - tmax_C
  - tmin_C

static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - frac_forest
  - soil_depth_pelletier
  - sand_frac
  - clay_frac
