experiment_name: lamar_scratch_3var
device: cuda:0

# Paths (relative to transfer_learning/)
data_dir: data/neuralhydrology
train_basin_file: data/basin_lists/lamar_basins.txt
validation_basin_file: data/basin_lists/lamar_basins.txt
test_basin_file: data/basin_lists/lamar_basins.txt

# Model Architecture (matching Kratzert et al. 2021 Appendix A2 Single Basin)
model: cudalstm
head: regression
output_activation: linear
hidden_size: 32
initial_forget_bias: 3
output_dropout: 0.4

# Training Settings
optimizer: Adam
loss: NSE
learning_rate: 1.0e-3
batch_size: 256
epochs: 100
validate_every: 4
save_weights_every: 4

# Learning rate schedule (will need to be implemented via callbacks if needed)
# Reduce to 5e-4 at epoch 20, then to 1e-4 at epoch 25

metrics:
  - NSE
  - KGE
  - RMSE
  - Pearson-r

# Data Configuration
dataset: generic
predict_last_n: 1
seq_length: 365  # From Kratzert et al. 2021

# Date Ranges (1 year spinup needed for seq_length=365)
train_start_date: '01/10/1991'
train_end_date: '30/09/2015'
validation_start_date: '01/10/2015'
validation_end_date: '30/09/2020'
test_start_date: '01/10/2020'
test_end_date: '31/12/2025'

target_variables:
  - QObs_mm_d

dynamic_inputs:
  - prcp_mm_day
  - tmax_C
  - tmin_C

# Static attributes omitted: single-basin training has zero variance for statics
