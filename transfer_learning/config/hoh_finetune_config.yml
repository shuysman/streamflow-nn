# Fine-Tuning Config for Hoh River (Transfer Learning)
# Loads weights from CAMELS pre-training and adapts to Hoh River
# Hoh is rain-dominated (unlike snowmelt-dominated Lamar)

experiment_name: hoh_finetune_tl
device: cuda:0

# Base Model (Pre-trained on 468 CAMELS basins)
base_run_dir: /home/steve/sync/streamflow/runs/camels_pretrain_cudalstm_compat

# Paths
data_dir: transfer_learning/data/neuralhydrology
train_basin_file: transfer_learning/data/hoh_basins.txt
validation_basin_file: transfer_learning/data/hoh_basins.txt
test_basin_file: transfer_learning/data/hoh_basins.txt

# Model (Must match Base Model Architecture exactly)
model: cudalstm
head: regression
output_activation: linear
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.4

# Fine-Tuning Settings
optimizer: Adam
loss: MSE
learning_rate: 0.0001  # 10x lower than pre-training for gentle adaptation
batch_size: 256
epochs: 30  # More epochs for Hoh (different regime than CAMELS avg)
finetune_modules:
  - lstm
  - head
metrics:
  - NSE
  - KGE
  - RMSE

# Data Configuration
dataset: generic
predict_last_n: 1
seq_length: 365

# Date ranges (Hoh climate data: 1990-01-01 to 2025-01-01)
# Need 365-day spinup, so training starts 1991-01-01
train_start_date: '01/01/1991'
train_end_date: '30/09/2015'
validation_start_date: '01/10/2015'
validation_end_date: '30/09/2020'
test_start_date: '01/10/2020'
test_end_date: '01/01/2025'

target_variables:
  - QObs_mm_d

dynamic_inputs:
  - prcp_mm_day
  - tmax_C
  - tmin_C

# Static attributes (same as CAMELS pre-training)
# Values should be set for Hoh River characteristics
static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - frac_forest
  - soil_depth_pelletier
  - sand_frac
  - clay_frac
